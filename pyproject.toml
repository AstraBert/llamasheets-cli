[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[project]
name = "llamasheets-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llama-cloud-services>=0.6.88",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "rich-gradient>=0.3.9",
    "tabulate>=0.9.0",
    "typer>=0.20.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
    "ty>=0.0.5",
]

[project.scripts]
sheets = "llamasheets_cli.app:app"

